<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Team 1 — Private Network Service Platform (Phase 1 topology)</text>

  <!-- Wi-Fi segment -->
  <rect x="60" y="62" width="860" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="490" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Wi-Fi "Rishihood_Learner"  ·  10.7.0.0/19 (255.255.224.0)  ·  gateway 10.7.0.1</text>
  <text x="490" y="99" text-anchor="middle" font-size="12" fill="#475569">all machines on interface en0, addresses from DHCP</text>
  <line x1="180" y1="106" x2="180" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="106" x2="490" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="106" x2="800" y2="150" stroke="#94a3b8" stroke-width="2"/>

  <!-- Mac 1 -->
  <rect x="60" y="150" width="240" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Mac 1 — Prince</text>
  <text x="180" y="196" text-anchor="middle" font-size="14" fill="#0f172a">10.7.28.177</text>
  <text x="180" y="220" text-anchor="middle" font-size="13" fill="#0f172a">dnsmasq  UDP/TCP 53</text>
  <text x="180" y="238" text-anchor="middle" font-size="13" fill="#0f172a">app/api.team1.test → 10.7.16.45</text>
  <text x="180" y="256" text-anchor="middle" font-size="13" fill="#0f172a">+ test client (curl, Chrome)</text>
  <text x="180" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">≈ Route 53 (managed DNS)</text>

  <!-- Mac 2 -->
  <rect x="370" y="150" width="240" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="490" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Mac 2 — Atanu</text>
  <text x="490" y="196" text-anchor="middle" font-size="14" fill="#0f172a">10.7.16.45</text>
  <text x="490" y="220" text-anchor="middle" font-size="13" fill="#0f172a">nginx  TCP 443 (TLS 1.2/1.3)</text>
  <text x="490" y="238" text-anchor="middle" font-size="13" fill="#0f172a">reverse proxy · TLS termination</text>
  <text x="490" y="256" text-anchor="middle" font-size="13" fill="#0f172a">round-robin load balancer</text>
  <text x="490" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">≈ AWS ALB / CDN edge</text>

  <!-- Mac 3 -->
  <rect x="680" y="150" width="240" height="150" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Mac 3 — Sambhav</text>
  <text x="800" y="196" text-anchor="middle" font-size="14" fill="#0f172a">10.7.7.111</text>
  <text x="800" y="220" text-anchor="middle" font-size="13" fill="#0f172a">Backend A  TCP 3001</text>
  <text x="800" y="238" text-anchor="middle" font-size="13" fill="#0f172a">Backend B  TCP 3002</text>
  <text x="800" y="256" text-anchor="middle" font-size="13" fill="#0f172a">+ test client + Wireshark</text>
  <text x="800" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">≈ EC2 instances in a target group</text>

  <!-- request flow -->
  <text x="490" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Request path for  https://app.team1.test/api/status  (client = Mac 1 or Mac 3)</text>

  <rect x="60" y="370" width="150" height="56" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="135" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Client</text>
  <text x="135" y="412" text-anchor="middle" font-size="12" fill="#475569">ephemeral port</text>

  <rect x="300" y="370" width="150" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="375" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">DNS (Mac 1)</text>
  <text x="375" y="412" text-anchor="middle" font-size="12" fill="#475569">:53</text>

  <rect x="540" y="370" width="150" height="56" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="615" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">nginx (Mac 2)</text>
  <text x="615" y="412" text-anchor="middle" font-size="12" fill="#475569">:443</text>

  <rect x="780" y="360" width="140" height="34" rx="8" fill="#ffedd5" stroke="#c2410c"/>
  <text x="850" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Backend A :3001</text>
  <rect x="780" y="402" width="140" height="34" rx="8" fill="#ffedd5" stroke="#c2410c"/>
  <text x="850" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Backend B :3002</text>

  <line x1="210" y1="385" x2="298" y2="385" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/>
  <line x1="298" y1="410" x2="212" y2="410" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahb)"/>
  <text x="254" y="378" text-anchor="middle" font-size="12" fill="#1d4ed8">① query A?</text>
  <text x="254" y="440" text-anchor="middle" font-size="12" fill="#1d4ed8">② 10.7.16.45 (TTL 60)</text>

  <path d="M135,426 C135,500 615,500 615,428" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ahg)"/>
  <text x="375" y="508" text-anchor="middle" font-size="12" fill="#15803d">③ TCP 3-way handshake → TLS handshake → encrypted HTTP/2 or HTTP/1.1</text>

  <line x1="690" y1="390" x2="778" y2="378" stroke="#c2410c" stroke-width="2" marker-end="url(#aho)"/>
  <line x1="690" y1="408" x2="778" y2="419" stroke="#c2410c" stroke-width="2" marker-end="url(#aho)"/>
  <text x="735" y="452" text-anchor="middle" font-size="12" fill="#c2410c">④ plain HTTP,</text>
  <text x="735" y="467" text-anchor="middle" font-size="12" fill="#c2410c">alternating A / B</text>

  <text x="490" y="542" text-anchor="middle" font-size="12" fill="#475569">UDP 53 for DNS · TCP 443 client→edge (encrypted) · TCP 3001/3002 edge→backend (unencrypted, inside LAN) · reply carries X-Backend: A|B</text>
</svg>
