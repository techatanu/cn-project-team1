# Mac 3 (Sambhav) - Ext C Service isolation with macOS pf.
# Backend ports 3001/3002 may be reached ONLY by the edge (Mac 2).
#
# Loaded by enable_firewall.sh into the pf anchor "com.apple/team1". macOS's default
# /etc/pf.conf already evaluates every anchor named com.apple/*, so this file
# never edits /etc/pf.conf and is removed again with one command (disable_firewall.sh).
#
# Macros passed on the command line (pfctl -D):
#   ext_if  interface to filter   LAN: Wi-Fi interface (en0)   Mode 1: lo0
#   edge    the only allowed IP   LAN: 10.7.16.45 (Mac 2)      Mode 1: 127.0.0.1
# Traffic that never crosses $ext_if (e.g. the standby edge on Mac 3 itself talking
# to 127.0.0.1:3001) is not affected.

backend_ports = "{ 3001, 3002 }"

# 1. the edge may open connections to the backends
pass in quick on $ext_if proto tcp from $edge to any port $backend_ports keep state
# 2. everyone else is silently dropped (client sees a TIMEOUT, not "connection refused")
block drop in quick on $ext_if proto tcp from any to any port $backend_ports
