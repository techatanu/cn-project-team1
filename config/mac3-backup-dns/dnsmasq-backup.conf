# Mac 3 (Sambhav, 10.7.24.9) - BACKUP DNS for team1.test - Phase 2 Ext A
# Same records + TTL as the primary on Mac 1, so a client that fails over gets
# the same answer.
# Install: cp dnsmasq-backup.conf /opt/homebrew/etc/dnsmasq.conf
#          cp team1.hosts         /opt/homebrew/etc/team1.hosts
#          sudo brew services restart dnsmasq
interface=en0
listen-address=127.0.0.1
domain-needed
bogus-priv
local=/team1.test/
addn-hosts=/opt/homebrew/etc/team1.hosts
local-ttl=30
no-resolv
server=8.8.8.8
server=1.1.1.1
log-queries
log-facility=/tmp/dnsmasq-backup.log
