# Mac 2 (Atanu, 10.7.16.45) - PRIMARY EDGE - Phase 2
# REPLACES servers/team1.conf (Phase 1). Do not keep both in servers/:
# nginx.conf has `include servers/*;`, so both files would load.
# Use scripts/phase2/edge_phase2_install.sh, which swaps them and can roll back.

# Log line: which backend served each request, plus the upstream status list.
# "$upstream_addr" shows two addresses when nginx retried (e.g. "A:3001, B:3002").
log_format team1_p2 '$remote_addr -> $upstream_addr [$time_local] "$request" '
                    '$status up_status=$upstream_status edge=primary';

upstream team1_backends {
    # round-robin (default). Passive health check (Ext D):
    # 1 failure marks a backend down for 5 s, then nginx tries it again.
    server 10.7.24.9:3001 max_fails=1 fail_timeout=5s;   # Backend A
    server 10.7.24.9:3002 max_fails=1 fail_timeout=5s;   # Backend B
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1_access.log team1_p2;

    # Ext E: tells the client WHICH edge answered (standby says "standby").
    add_header X-Edge primary always;

    location / {
        proxy_pass http://team1_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Ext D: fail fast and retry the request on the other backend.
        proxy_connect_timeout 2s;      # 1s was too short on Wi-Fi: one lost SYN is resent after ~1s,
                                       # so 1s failed a healthy backend (LAN run 3, 15:09:36)
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;   # room for a 2s attempt on A + the retry on B
    }
}
