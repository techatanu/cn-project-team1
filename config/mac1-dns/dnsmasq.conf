# Mac 1 (Prince, 10.7.23.243) - PRIMARY DNS for team1.test - Phase 2
# Install: cp dnsmasq.conf /opt/homebrew/etc/dnsmasq.conf
#          cp team1.hosts  /opt/homebrew/etc/team1.hosts
#          sudo brew services restart dnsmasq
interface=en0
listen-address=127.0.0.1
domain-needed
bogus-priv
local=/team1.test/
# Phase 2: records live in a hosts file, so a record change (Ext B / Ext E) is
# "edit team1.hosts + sudo killall -HUP dnsmasq" with no restart.
addn-hosts=/opt/homebrew/etc/team1.hosts
# Phase 2 Ext B: short, clearly visible TTL (was 60 in Phase 1)
local-ttl=30
no-resolv
server=8.8.8.8
server=1.1.1.1
log-queries
log-facility=/tmp/dnsmasq.log
